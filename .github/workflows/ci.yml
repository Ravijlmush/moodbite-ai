name: MoodBite AI CI & 30-Prompt Stress Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests-and-stress-suite:
    name: Backend Pytest, 50-Scenario Evals & 30-Prompt Stress Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full pytest suite (including test_stress_suite.py & test_swiggy_mcp.py)
        run: pytest -v

      - name: Run 50-scenario golden evals
        run: python evals/run_evals.py

      - name: Run 30-prompt adversarial, safety & load stress suite
        run: python evals/run_stress_suite.py

      - name: Upload generated stress suite reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-suite-report
          path: |
            docs/STRESS_TEST_REPORT.md
            backend/evals/stress_suite_report.json

  frontend-typecheck-and-build:
    name: Frontend TypeScript Check & Next.js Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Next.js production build
        run: npm run build
